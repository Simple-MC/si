<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Regalo para Shofi</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background-color: #fdfbf7;
            padding-top: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }
        .btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            border-radius: 15px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-pdf { background-color: #ffcc00; color: #333; }
        .btn-practica { background-color: #4a90e2; }
        .btn-extra { background-color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Feliz Cumpleaños, Shofi!</h1>
        <p>He preparado esto para ti, espero que te guste mucho.</p>

        <!-- Botón para ver el PDF -->
        <a href="Carta_Cumpleanos_V2.pdf" class="btn btn-pdf" target="_blank">📖 Leer mi carta</a>

        <!-- Botón para el modo práctica (enlace a tu juego de práctica en Roblox) -->
        <a href="URL_DE_TU_JUEGO_DE_ROBLOX" class="btn btn-practica">🎯 Modo Práctica (Aim)</a>

        <!-- Botón extra -->
        <a href="#" class="btn btn-extra">✨ Mensaje secreto</a>
    </div>
</body>
</html>
