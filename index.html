<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Shofi</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fdfbf7; padding: 20px; }
        .btn { display: block; width: 200px; margin: 10px auto; padding: 15px; background: #ffcc00; text-decoration: none; color: black; border-radius: 10px; font-weight: bold; }
        #game-container { display: none; margin-top: 20px; border: 2px solid #333; height: 300px; position: relative; background: white; cursor: crosshair; }
        .target { width: 40px; height: 40px; background: red; border-radius: 50%; position: absolute; }
    </style>
</head>
<body>
    <h1>¡Feliz Cumpleaños Shofi!</h1>
    <a href="Carta_Cumpleanos_V2.pdf" class="btn" target="_blank">📖 Leer mi carta</a>
    <button class="btn" onclick="startGame()">🎯 Iniciar Práctica Aim</button>

    <div id="game-container" onclick="miss()"></div>
    <p id="score">Puntuación: 0</p>

    <script>
        let score = 0;
        function startGame() {
            document.getElementById('game-container').style.display = 'block';
            spawnTarget();
        }
        function spawnTarget() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';
            const t = document.createElement('div');
            t.className = 'target';
            t.style.top = Math.random() * 260 + 'px';
            t.style.left = Math.random() * 560 + 'px';
            t.onclick = (e) => { e.stopPropagation(); score++; document.getElementById('score').innerText = 'Puntuación: ' + score; spawnTarget(); };
            container.appendChild(t);
        }
        function miss() { score = Math.max(0, score - 1); document.getElementById('score').innerText = 'Puntuación: ' + score; }
    </script>
</body>
</html>
