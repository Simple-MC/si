<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 razones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 20px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #e7e9ea;
        }

        .razones {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .razon {
            border-bottom: 1px solid #2f3336;
            padding-bottom: 15px;
        }

        .razon:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .title {
            font-weight: 700;
            font-size: 1rem;
            color: #1d9bf0;
            margin-bottom: 4px;
        }

        .text {
            font-size: 0.95rem;
            color: #71767b;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>3 razones por las que me cae bien Camila</h1>

        <div class="razones">
            <!-- 1 -->
            <div class="razon">
                <div class="title">1. Porque está minion</div>
                <div class="text">Mide como un metro, parece llavero.</div>
            </div>

            <!-- 2 -->
            <div class="razon">
                <div class="title">2. Por su risa de oveja</div>
                <div class="text">Literal se ríe y suena "beee", da un buen de risa.</div>
            </div>

            <!-- 3 -->
            <div class="razon">
                <div class="title">3. Me hace reír</div>
                <div class="text">Siempre sale con cualquier tontería.</div>
            </div>
        </div>
    </div>

</body>
</html>
