<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fracciones - Sigma 676</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --filled: #60a5fa;
            --empty: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        /* Botón de ordenar */
        .btn-sort {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            font-weight: bold;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px; /* Tamaño ideal para celular */
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Sección Matemática Principal */
        .math-section {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 1rem;
            border-bottom: 1px solid var(--empty);
            padding-bottom: 1rem;
        }

        .fraction-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .num { border-bottom: 2px solid var(--text-main); padding: 0 0.5rem; }
        .den { padding: 0 0.5rem; }
        
        .equals { font-size: 1.5rem; color: var(--text-muted); }
        
        .decimal-result {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }

        /* Representación de División (Casita) */
        .division-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: monospace;
            font-size: 1.2rem;
        }
        .div-quotient {
            padding-bottom: 2px;
            margin-left: 20px;
        }
        .div-bottom {
            display: flex;
            align-items: center;
        }
        .div-divisor {
            padding-right: 5px;
        }
        .div-dividend {
            border-top: 2px solid var(--text-main);
            border-left: 2px solid var(--text-main);
            padding-left: 5px;
            padding-top: 2px;
        }

        /* Sección de Gráficos Simples */
        .graphics-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .graphic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .graphic-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* 1. Pastel (Círculo dividido) */
        .pie-chart {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: relative;
            border: 2px solid var(--border-color);
            overflow: hidden;
        }
        .pie-svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* 2. Barra segmentada */
        .bar-chart {
            display: flex;
            width: 100%;
            height: 25px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-segment {
            flex: 1;
            border-right: 1px solid var(--bg-color);
        }
        .bar-segment:last-child { border-right: none; }
        .filled { background-color: var(--filled); }
        .empty { background-color: var(--empty); }

        /* 3. Cuadrícula */
        .grid-chart {
            display: grid;
            gap: 2px;
            background-color: var(--border-color);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 1px;
        }
        .grid-cell {
            width: 16px;
            height: 16px;
        }

        /* Footer */
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #f43f5e;
            padding-bottom: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Resolución de Fracciones</h1>
    </header>

    <button class="btn-sort" onclick="ordenarTarjetas()">Ordenar de Mayor a Menor</button>

    <div class="container" id="tarjetas-container">
        </div>

    <footer>
        Créditos al más Sigma 676
    </footer>

    <script>
        // Aquí están los datos exactamente como los pediste, sin rayitas extrañas.
        const fracciones = [
            { n: 2, d: 8, dec: "0.25" },
            { n: 5, d: 8, dec: "0.625" },
            { n: 9, d: 10, dec: "0.9" },
            { n: 7, d: 12, dec: "0.5833..." },
            { n: 8, d: 9, dec: "0.888..." },
            { n: 3, d: 6, dec: "0.5" },
            { n: 3, d: 9, dec: "0.333..." },
            { n: 1, d: 3, dec: "0.333..." },
            { n: 7, d: 8, dec: "0.875" }
        ];

        const container = document.getElementById('tarjetas-container');

        // Función para dibujar líneas dentro del círculo (Pastel)
        function generarLineasPastel(divisor) {
            let svg = `<svg viewBox="0 0 100 100" class="pie-svg-overlay">`;
            for(let i = 0; i < divisor; i++) {
                let rotacion = (i * 360) / divisor;
                svg += `<line x1="50" y1="50" x2="50" y2="0" stroke="#0f172a" stroke-width="2" transform="rotate(${rotacion} 50 50)" />`;
            }
            svg += `</svg>`;
            return svg;
        }

        // Función para crear cada tarjeta dinámicamente
        function renderizarTarjetas(datos) {
            container.innerHTML = "";
            
            datos.forEach(f => {
                // Cálculo para el llenado del pastel
                const porcentaje = (f.n / f.d) * 100;
                
                // Generar los cuadraditos de la barra
                let barraHtml = "";
                for(let i = 0; i < f.d; i++) {
                    barraHtml += `<div class="bar-segment ${i < f.n ? 'filled' : 'empty'}"></div>`;
                }

                // Generar los cuadraditos de la matriz (grid)
                // Para que no se vea como una tira larga, calculamos cuántas columnas tener
                let columnasGrid = Math.ceil(Math.sqrt(f.d));
                if (f.d === 12) columnasGrid = 4;
                if (f.d === 10) columnasGrid = 5;
                if (f.d === 8) columnasGrid = 4;
                if (f.d === 6) columnasGrid = 3;

                let gridHtml = `<div class="grid-chart" style="grid-template-columns: repeat(${columnasGrid}, 1fr);">`;
                for(let i = 0; i < f.d; i++) {
                    gridHtml += `<div class="grid-cell ${i < f.n ? 'filled' : 'empty'}"></div>`;
                }
                gridHtml += `</div>`;

                // Construcción de la tarjeta HTML
                const tarjeta = document.createElement('div');
                tarjeta.className = 'card';
                // Usamos el número real para poder ordenar después (quitando el '...')
                tarjeta.dataset.valor = parseFloat(f.dec.replace('...', ''));

                tarjeta.innerHTML = `
                    <div class="math-section">
                        <div class="fraction-view">
                            <span class="num">${f.n}</span>
                            <span class="den">${f.d}</span>
                        </div>
                        
                        <span class="equals">=</span>
                        
                        <div class="division-box">
                            <div class="div-quotient">${f.dec}</div>
                            <div class="div-bottom">
                                <div class="div-divisor">${f.d}</div>
                                <div class="div-dividend">${f.n}</div>
                            </div>
                        </div>
                    </div>

                    <div class="graphics-section">
                        <div class="graphic-container">
                            <span class="graphic-label">Círculo</span>
                            <div class="pie-chart" style="background: conic-gradient(var(--filled) 0% ${porcentaje}%, var(--empty) ${porcentaje}% 100%);">
                                ${generarLineasPastel(f.d)}
                            </div>
                        </div>

                        <div class="graphic-container">
                            <span class="graphic-label">Barrita</span>
                            <div class="bar-chart">
                                ${barraHtml}
                            </div>
                        </div>

                        <div class="graphic-container">
                            <span class="graphic-label">Cuadrículas</span>
                            ${gridHtml}
                        </div>
                    </div>
                `;
                container.appendChild(tarjeta);
            });
        }

        // Renderizar la primera vez
        renderizarTarjetas(fracciones);

        // Función para el botón de ordenar
        function ordenarTarjetas() {
            // Ordenar el arreglo original de mayor a menor basándose en el valor decimal
            fracciones.sort((a, b) => {
                let valA = parseFloat(a.dec.replace('...', ''));
                let valB = parseFloat(b.dec.replace('...', ''));
                return valB - valA;
            });
            // Volver a dibujar
            renderizarTarjetas(fracciones);
        }
    </script>
</body>
</html>
